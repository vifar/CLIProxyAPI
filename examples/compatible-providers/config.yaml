# Static fallback configuration for the compatible providers.
#
# See ../../docs/compatible-providers.md for discovery, fallback and exclusion rules.
#
# Copy this file to your own config.yaml and edit it. It carries no credentials:
# add the API keys for the providers you actually use.
#
# Provider endpoints:
#   ollama-cloud   https://ollama.com/v1
#   openrouter     https://openrouter.ai/api/v1
#   vercel         https://ai-gateway.vercel.sh/v1

port: 8318

host: 127.0.0.1

auth-dir: "~/.cli-proxy-api"

debug: false

logging-to-file: false

usage-statistics-enabled: true

request-retry: 3

# Session-sticky round robin: a session stays on the provider and credential it was
# bound to. Mixed routes balance providers equally, so a provider's share of
# traffic does not scale with its credential count.
routing:
  strategy: round-robin
  session-affinity: true
  session-affinity-ttl: "1h"

quota-exceeded:
  switch-project: true
  switch-preview-model: true

# The management API is disabled unless a secret key is set. Keep it on localhost.
remote-management:
  allow-remote: false
  secret-key: ""

openai-compatibility:
  # Ollama Cloud. Its live model list is read from https://ollama.com/v1/models and
  # needs an API key.
  - name: ollama-cloud
    base-url: https://ollama.com/v1
    api-key-entries:
      - api-key: "replace-with-your-ollama-cloud-key"
    models:
      - name: deepseek-v4.1-flash
        alias: deepseek-v4.1-flash
      - name: deepseek-v4-flash
        alias: deepseek-v4-flash
      - name: deepseek-v4-pro
        alias: deepseek-v4-pro
      - name: kimi-k3
        alias: kimi-k3
      - name: kimi-k2.7-code
        alias: kimi-k2.7-code
      - name: kimi-k2.6
        alias: kimi-k2.6
      - name: glm-5.3
        alias: glm-5.3
      - name: glm-5.2
        alias: glm-5.2
      - name: minimax-m3
        alias: minimax-m3

  # OpenRouter. Its live model list is read from https://openrouter.ai/api/v1/models
  # and is public, so no key is needed to read the list, but a key is needed to
  # route requests.
  - name: openrouter
    base-url: https://openrouter.ai/api/v1
    api-key-entries:
      - api-key: "replace-with-your-openrouter-key"
    models:
      - name: anthropic/claude-sonnet-4.5
        alias: claude-sonnet-4.5
      - name: anthropic/claude-opus-4.5
        alias: claude-opus-4.5
      - name: openai/gpt-4o
        alias: gpt-4o
      - name: openai/gpt-4.1
        alias: gpt-4.1
      - name: google/gemini-2.5-pro
        alias: gemini-2.5-pro
      - name: google/gemini-2.5-flash
        alias: gemini-2.5-flash
      - name: deepseek/deepseek-r1
        alias: deepseek-r1
      - name: qwen/qwen3-max
        alias: qwen3-max

  # Vercel AI Gateway. Its live model list is read from
  # https://ai-gateway.vercel.sh/v1/models and is public.
  - name: vercel
    base-url: https://ai-gateway.vercel.sh/v1
    api-key-entries:
      - api-key: "replace-with-your-vercel-key"
    models:
      - name: anthropic/claude-sonnet-4.5
        alias: claude-sonnet-4.5
      - name: openai/gpt-4.1
        alias: gpt-4.1
      - name: google/gemini-2.5-flash
        alias: gemini-2.5-flash
      - name: deepseek/deepseek-v3.1
        alias: deepseek-v3.1
